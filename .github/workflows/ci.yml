name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Apple Silicon app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check build architecture
        run: test "$(uname -m)" = arm64
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Test MIDI mapping and driver
        run: cargo test --workspace --locked
      - name: Build and sign locally
        run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Mikro-MIDI-macOS-arm64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
